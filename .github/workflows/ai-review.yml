# Read-only AI review of same-repo PRs. It may comment; it can never push, approve or request
# changes. Documented in docs/ci-agents.md. Its key is the repository secret
# ANTHROPIC_API_KEY_REVIEW, a different key from the evals one.
name: ai-review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: ai-review
    # Same-repo, non-draft, human-opened PRs only. Fork PRs never get the key.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # no write: git push fails even if attempted
      pull-requests: write # PR comments and inline review comments only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load review prompt
        id: prompt
        run: |
          test -s prompts/ci/ai-review.md # fail closed: no review without its instructions
          delim="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            cat prompts/ci/ai-review.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_REVIEW }}
          # The job's GITHUB_TOKEN, so the action never swaps in a Claude GitHub App token
          # (no id-token: write is granted, so it can't).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The prompt lives in prompts/ci/ai-review.md (AGENTS.md: prompts are files in prompts/).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.prompt.outputs.text }}
          # --setting-sources user: skip the PR's own .claude/settings.json, so hooks from the
          # PR branch never run in this job.
          # No shell and no local file tools: the reviewer reads the PR and repo files only through
          # the GitHub API (the GitHub MCP server, in its own container with just the job token) and
          # can only comment. Nothing it can call reaches the Anthropic key in its process env, the
          # MCP config on its command line, or the token the action writes into .git/config.
          # Read, Grep and Glob need no permission by default, so they are denied explicitly.
          # The GitHub MCP server exposes all its tools, so its write tools are denied by name too,
          # on top of the allowlist and the token's scopes.
          # --strict-mcp-config: only the action's MCP servers, never a .mcp.json from the repo.
          claude_args: |
            --max-turns 15
            --setting-sources user
            --strict-mcp-config
            --allowedTools "mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_files,mcp__github__get_file_contents,mcp__github__add_issue_comment,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Read,Grep,Glob,Edit,Write,MultiEdit,NotebookEdit,NotebookRead,WebFetch,WebSearch,Task,Agent,mcp__github__create_and_submit_pull_request_review,mcp__github__create_pending_pull_request_review,mcp__github__submit_pending_pull_request_review,mcp__github__add_comment_to_pending_review,mcp__github__delete_pending_pull_request_review,mcp__github__merge_pull_request,mcp__github__update_pull_request,mcp__github__update_pull_request_branch,mcp__github__create_pull_request,mcp__github__request_copilot_review,mcp__github__create_branch,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github__push_files,mcp__github__create_repository,mcp__github__fork_repository,mcp__github__create_issue,mcp__github__update_issue,mcp__github__assign_copilot_to_issue"
