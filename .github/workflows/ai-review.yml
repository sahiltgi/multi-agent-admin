# Read-only AI review of same-repo PRs. It may comment; it can never push, approve or request
# changes. Documented in docs/ci-agents.md. Its key lives in the `ai-review` GitHub Environment,
# separate from the evals key.
name: ai-review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: ai-review
    # Same-repo, non-draft, human-opened PRs only. Fork PRs never get the key.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-review
    env:
      # Strip the Anthropic key and other secrets from the env of Bash subprocesses (gh), so an
      # injected `gh pr comment --body-file /proc/self/environ` can't post them. The action only
      # turns this on by itself for allowed_non_write_users.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read # no write: git push fails even if attempted
      pull-requests: write # PR comments and inline review comments only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Load review prompt
        id: prompt
        run: |
          test -s prompts/ci/ai-review.md # fail closed: no review without its instructions
          delim="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            cat prompts/ci/ai-review.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The job's GITHUB_TOKEN, so the action never swaps in a Claude GitHub App token
          # (no id-token: write is granted, so it can't).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The prompt lives in prompts/ci/ai-review.md (AGENTS.md: prompts are files in prompts/).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.prompt.outputs.text }}
          # --setting-sources user: skip the PR's own .claude/settings.json, so hooks from the
          # PR branch never run in this job (the Stop hook would also run the test suite).
          # Read(./.git/**) is denied because the action writes the job token into .git/config.
          claude_args: |
            --max-turns 15
            --setting-sources user
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --disallowedTools "Read(./.git/**),Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Agent,Bash(git push:*),Bash(git commit:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh api:*)"
