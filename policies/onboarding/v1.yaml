# Onboarding role templates v1 (spec onboarding, rule 1; OQ-1). Synthetic draft for owner review.
# Validated by OnboardingPolicyV1 in server/src/gate/onboarding-policy.schema.ts; any change here
# must change tests or evals in the same commit (HARD RULE 5). Changing even a comment changes
# policyHash.
# owner: it | admin | manager | buddy. dueOffsetDays: whole calendar days from the start date
# (negative = before day one), -30..90, no weekend or holiday shift (OQ-8). dependsOn names task
# ids in the same template; unknown ids, self-dependencies and cycles fail startup (OQ-5).
version: v1
templates:
  engineer:
    title: Engineer
    tasks:
      - id: laptop
        title: Prepare laptop
        owner: it
        dueOffsetDays: -3
        dependsOn: []
      - id: accounts
        title: Create accounts and repository access
        owner: it
        dueOffsetDays: -1
        dependsOn: [laptop]
      - id: desk
        title: Assign desk and building badge
        owner: admin
        dueOffsetDays: -1
        dependsOn: []
      - id: welcome
        title: Welcome meeting
        owner: manager
        dueOffsetDays: 0
        dependsOn: []
